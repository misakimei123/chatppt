[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatppt"
version = "0.1.0"
description = "Workflow-first ChatPPT service with page-level edits."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "langchain-core>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
  "lxml>=5.3,<6.0",
  "pydantic>=2.10,<3.0",
  "python-pptx>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["chatppt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
